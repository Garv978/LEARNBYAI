name: NPM Audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Audit Server
        working-directory: server
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Audit Client
        working-directory: client
        run: |
          npm ci
          npm audit --audit-level=high